name: Security regression checks

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/src/**'
      - 'server/**'
      - 'shared/**'
      - 'prisma/**'
      - 'prisma.config.ts'
      - 'patches/**'
      - 'app/package.json'
      - '**/tsconfig*.json'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/security-checks.yml'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run prisma:generate
      - name: Security regression suites
        run: cd server && bun run test:security
      - name: Prisma adapter configuration regressions without a database
        run: bun test prisma/connection.test.ts
      - name: AI SDK and protocol regressions without paid endpoints
        run: bun server/aiServer/test.ts
      - name: Node runtime regressions
        run: node --test server/aiServer/providers/__tests__/node-runtime.test.mjs
      - name: Typecheck security policy modules
        run: >-
          bun run tsc --ignoreConfig --types node --noEmit --strict --skipLibCheck --esModuleInterop
          --moduleResolution bundler --module ESNext --target ES2020
          server/lib/fileAccessPolicy.ts server/lib/providerVisibility.ts
          server/lib/pluginPaths.ts server/lib/mcpStdioPolicy.ts
          server/lib/publicHttp.ts server/lib/twoFactorLogin.ts
          server/lib/attachmentBinding.ts app/src/lib/fileUrl.ts
          app/src/lib/pendingTwoFactor.ts
      - name: Typecheck frontend and backend
        run: |
          bun run tsc --noEmit -p app/tsconfig.json
          bun run tsc --noEmit -p server/tsconfig.json
      - name: Build public plugin types
        run: bun run build:blinko:types
      - name: Build frontend
        run: cd app && bun run build:web
      - name: Build backend
        run: cd server && bun run build:web
