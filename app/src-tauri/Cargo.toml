[package]
name = "Blinko"
version = "0.1.0"
description = "A Blinko App"
authors = ["blinko-space"]
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "~2.12.5", features = ["devtools", "rustls-tls", "tray-icon", "image-png"] }
tauri-plugin-opener = "=2.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-plugin-os = "=2.4.0"
tauri-plugin-fs = "=2.7.1"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-http = "=2.8.3"
tauri-plugin-upload = "=2.5.0"
tauri-plugin-blinko = { path = "../tauri-plugin-blinko/" }
tauri-plugin-process = "=2.4.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "=2.14.1"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "=2.7.0"
get-selected-text = "0.1.6"
arboard = { version = "3.7.0", default-features = false }
mouse_position = "0.1.4"
enigo = "0.6.1"
rdev = "0.5.3"
sys-locale = "0.3.2"

 

[target.'cfg(target_os = "windows")'.dependencies]
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "sync"] }



[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.2"
